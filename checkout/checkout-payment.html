<section class="checkout-payment-section">
  <h2 class="checkout-section-title">Payment options</h2>

  <div class="checkout-payment-options" id="paymentOptionsGroup">
    <label class="checkout-payment-option">
      <input
        type="radio"
        name="paymentMethod"
        value="venmo"
        class="checkout-payment-radio"
      />
      <span class="checkout-payment-custom-radio" aria-hidden="true"></span>

      <span class="checkout-payment-content">
        <span class="checkout-payment-title">
          Venmo (please include your order # in the note)
        </span>
        <span class="checkout-payment-description">
          Place your order, then follow the instructions on the order confirmation page to complete payment with Venmo.
        </span>
      </span>
    </label>

    <label class="checkout-payment-option">
      <input
        type="radio"
        name="paymentMethod"
        value="zelle"
        class="checkout-payment-radio"
      />
      <span class="checkout-payment-custom-radio" aria-hidden="true"></span>

      <span class="checkout-payment-content">
        <span class="checkout-payment-title">
          Zelle (please include your order # in the note)
        </span>
        <span class="checkout-payment-description">
          Place your order, then follow the instructions on the order confirmation page to complete payment with Zelle.
        </span>
      </span>
    </label>

    <label class="checkout-payment-option">
      <input
        type="radio"
        name="paymentMethod"
        value="cashapp"
        class="checkout-payment-radio"
      />
      <span class="checkout-payment-custom-radio" aria-hidden="true"></span>

      <span class="checkout-payment-content">
        <span class="checkout-payment-title">
          <span class="checkout-payment-title-row">
            <span>Cash App Bitcoin</span>
            <span class="checkout-payment-discount-badge">5% OFF</span>
          </span>
        </span>
        <span class="checkout-payment-description">
          Pay with Bitcoin through Cash App, then send your order number and payment confirmation on WhatsApp or Telegram from the order confirmation page.
        </span>
      </span>
    </label>

    <label class="checkout-payment-option" id="bankTransferOption">
      <input
        type="radio"
        name="paymentMethod"
        value="banktransfer"
        class="checkout-payment-radio"
      />
      <span class="checkout-payment-custom-radio" aria-hidden="true"></span>

      <span class="checkout-payment-content">
        <span class="checkout-payment-title" id="bankTransferTitle">
          Domestic Bank Transfer
        </span>
        <span class="checkout-payment-description" id="bankTransferDescription">
          For U.S. customers, place your order and follow the order confirmation page instructions to complete payment by domestic bank transfer.
        </span>
      </span>
    </label>

    <label class="checkout-payment-option">
      <input
        type="radio"
        name="paymentMethod"
        value="applepay"
        class="checkout-payment-radio"
      />
      <span class="checkout-payment-custom-radio" aria-hidden="true"></span>

      <span class="checkout-payment-content">
        <span class="checkout-payment-title">
          Apple Pay (please include your order # in the note if prompted)
        </span>
        <span class="checkout-payment-description">
          Place your order, then follow the instructions on the order confirmation page to complete payment with Apple Pay.
        </span>
      </span>
    </label>

    <label class="checkout-payment-option">
      <input
        type="radio"
        name="paymentMethod"
        value="crypto"
        class="checkout-payment-radio"
      />
      <span class="checkout-payment-custom-radio" aria-hidden="true"></span>

      <span class="checkout-payment-content">
        <span class="checkout-payment-title">
          <span class="checkout-payment-title-row">
            <span>Crypto (BTC, ETH, USDT, USDC, SOL)</span>
            <span class="checkout-payment-discount-badge">5% OFF</span>
          </span>
        </span>
        <span class="checkout-payment-description">
          Pay with crypto, then send your order number and transaction ID on WhatsApp or Telegram from the order confirmation page.
        </span>
      </span>
    </label>
  </div>
</section>
